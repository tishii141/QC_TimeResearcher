<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QC 業務時間計測</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>QC 業務時間計測</h1>
    <nav class="tab-nav">
      <button class="tab-btn active" data-tab="timer">タイマー</button>
      <button class="tab-btn" data-tab="report">レポート</button>
      <button class="tab-btn" data-tab="category">カテゴリ管理</button>
    </nav>
  </header>

  <main>

    <!-- ========== タイマータブ ========== -->
    <section id="tab-timer" class="tab-section active">
      <div class="card">
        <h2>計測開始</h2>
        <div class="form-row">
          <label for="select-major">大分類</label>
          <select id="select-major">
            <option value="">-- 選択してください --</option>
          </select>
        </div>
        <div class="form-row">
          <label for="select-minor">中分類</label>
          <select id="select-minor" disabled>
            <option value="">-- 選択してください --</option>
          </select>
        </div>
        <div class="timer-display">
          <span id="elapsed-time">00:00:00</span>
        </div>
        <div class="timer-buttons">
          <button id="btn-start" class="btn btn-start">▶ 開始</button>
          <button id="btn-stop" class="btn btn-stop" disabled>■ 停止</button>
        </div>
        <div id="timer-status" class="timer-status"></div>
      </div>

      <div class="card">
        <h2>本日の記録</h2>
        <div id="today-table-container">
          <p class="empty-state">まだ記録がありません</p>
        </div>
      </div>
    </section>

    <!-- ========== レポートタブ ========== -->
    <section id="tab-report" class="tab-section">
      <div class="card">
        <div class="report-controls">
          <div class="report-type-btns">
            <button class="report-type-btn active" data-type="daily">日別</button>
            <button class="report-type-btn" data-type="weekly">週別</button>
            <button class="report-type-btn" data-type="monthly">月別</button>
          </div>
          <div class="date-picker-row">
            <label for="report-date" id="report-date-label">日付</label>
            <input type="date" id="report-date">
            <input type="week" id="report-week" style="display:none">
            <input type="month" id="report-month" style="display:none">
          </div>
          <button id="btn-csv" class="btn btn-secondary">CSV ダウンロード</button>
        </div>
      </div>

      <div class="card">
        <h2 id="report-title">レポート</h2>
        <div id="report-table-container">
          <p class="empty-state">データがありません</p>
        </div>
      </div>

      <div class="card chart-card">
        <h2>グラフ</h2>
        <div class="chart-toggle">
          <button class="chart-type-btn active" data-chart="bar">棒グラフ</button>
          <button class="chart-type-btn" data-chart="pie">円グラフ</button>
        </div>
        <div class="canvas-wrapper">
          <canvas id="report-chart" width="800" height="400"></canvas>
        </div>
        <div id="chart-legend" class="chart-legend"></div>
      </div>
    </section>

    <!-- ========== カテゴリ管理タブ ========== -->
    <section id="tab-category" class="tab-section">
      <div class="card">
        <h2 id="category-form-title">カテゴリを追加</h2>
        <form id="category-form" class="category-form">
          <input type="hidden" id="category-edit-id">
          <div class="form-row">
            <label for="input-major">大分類</label>
            <input type="text" id="input-major" placeholder="例：検査、打合せ、資料作成" required>
          </div>
          <div class="form-row">
            <label for="input-minor">中分類</label>
            <input type="text" id="input-minor" placeholder="例：外観検査、朝礼、報告書" required>
          </div>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary" id="btn-category-save">追加</button>
            <button type="button" class="btn btn-secondary" id="btn-category-cancel" style="display:none">キャンセル</button>
          </div>
        </form>
      </div>

      <div class="card">
        <h2>カテゴリ一覧</h2>
        <div id="category-list-container">
          <p class="empty-state">カテゴリが登録されていません</p>
        </div>
      </div>
    </section>

  </main>

  <!-- クラッシュ復旧モーダル -->
  <div id="crash-modal" class="modal" style="display:none">
    <div class="modal-content">
      <h2>前回のセッションが中断されました</h2>
      <p id="crash-modal-msg"></p>
      <div class="modal-actions">
        <button id="btn-crash-save" class="btn btn-primary">記録として保存</button>
        <button id="btn-crash-discard" class="btn btn-danger">破棄</button>
      </div>
    </div>
  </div>
  <div id="modal-overlay" class="modal-overlay" style="display:none"></div>

  <script src="app.js"></script>
</body>
</html>
